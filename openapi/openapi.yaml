openapi: 3.1.0
info:
  title: QRFlow API
  version: 0.2.0
  description: Implemented API surface for auth, workspaces/folders/custom domains, QR CRUD, real PNG/SVG downloads, public scan routing, billing, bulk import/export, and QR analytics.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Auth
  - name: QR Codes
  - name: Workspaces
  - name: Billing
  - name: Public

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: API is healthy

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user and create default workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current bearer session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Issue a password-reset token for a known email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with a valid token and create a fresh session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /me:
    get:
      tags: [Auth]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [Auth]
      summary: Update current user profile settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /billing/plans:
    get:
      tags: [Billing]
      summary: List starter billing plans
      responses:
        "200":
          description: Plan list

  /qr-codes:
    get:
      tags: [QR Codes]
      summary: List QR codes owned by current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
        - in: query
          name: workspaceId
          schema:
            type: string
            format: uuid
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/QRCodeStatus"
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListQrCodesResponse"
    post:
      tags: [QR Codes]
      summary: Create QR code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQRCodeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateQRCodeResponse"

  /qr-codes/{id}:
    get:
      tags: [QR Codes]
      summary: Get QR code
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: QR code details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRCode"
    patch:
      tags: [QR Codes]
      summary: Update QR code without changing slug
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQRCodeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRCode"
    delete:
      tags: [QR Codes]
      summary: Soft delete QR code
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Deleted

  /qr-codes/{id}/downloads:
    get:
      tags: [QR Codes]
      summary: List QR asset downloads or stream a concrete PNG/SVG asset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - in: query
          name: format
          schema:
            $ref: "#/components/schemas/ExportFormat"
          description: When provided, the endpoint streams the requested file instead of returning metadata.
      responses:
        "200":
          description: Download metadata or file bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadsResponse"
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "302":
          description: Signed object-storage redirect when remote private storage is enabled

  /qr-codes/{id}/render:
    post:
      tags: [QR Codes]
      summary: Regenerate PNG and SVG QR image assets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Accepted

  /qr-codes/{id}/analytics:
    get:
      tags: [QR Codes]
      summary: Get daily scan aggregates and recent raw scan events for a QR code
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - in: query
          name: from
          schema:
            type: string
          description: Inclusive range start, usually YYYY-MM-DD.
        - in: query
          name: to
          schema:
            type: string
          description: Inclusive range end, usually YYYY-MM-DD.
      responses:
        "200":
          description: Analytics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRAnalyticsResponse"

  /qr-codes/{id}/activate:
    post:
      tags: [QR Codes]
      summary: Activate QR code
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Activated

  /qr-codes/{id}/deactivate:
    post:
      tags: [QR Codes]
      summary: Deactivate QR code
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Deactivated

  /qr-codes/{id}/archive:
    post:
      tags: [QR Codes]
      summary: Archive QR code
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Archived

  /qr-codes/{id}/duplicate:
    post:
      tags: [QR Codes]
      summary: Duplicate QR code with a new slug
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateQRCodeResponse"

  /workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces available to the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
    post:
      tags: [Workspaces]
      summary: Create a new workspace owned by the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /workspaces/{workspaceId}/folders:
    get:
      tags: [Workspaces]
      summary: List folders for a workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
      responses:
        "200":
          description: Folder list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListResponse"
    post:
      tags: [Workspaces]
      summary: Create a folder inside a workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"

  /workspaces/{workspaceId}/custom-domains:
    get:
      tags: [Workspaces]
      summary: List custom domains attached to a workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
      responses:
        "200":
          description: Custom-domain list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomainListResponse"
    post:
      tags: [Workspaces]
      summary: Attach a custom domain to a workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomDomainRequest"
      responses:
        "201":
          description: Custom domain created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomain"

  /workspaces/{workspaceId}/custom-domains/{domainId}/verify:
    post:
      tags: [Workspaces]
      summary: Verify a custom domain using the expected token
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/DomainIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCustomDomainRequest"
      responses:
        "200":
          description: Custom domain verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDomain"

  /workspaces/{workspaceId}/custom-domains/{domainId}:
    delete:
      tags: [Workspaces]
      summary: Remove a custom domain from a workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/DomainIdPath"
      responses:
        "200":
          description: Domain removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /workspaces/{workspaceId}/qr-codes/export:
    get:
      tags: [Workspaces]
      summary: Export QR codes for a workspace as JSON or CSV
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - in: query
          name: format
          schema:
            $ref: "#/components/schemas/BulkTransferFormat"
      responses:
        "200":
          description: Export file
          content:
            application/json:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary

  /workspaces/{workspaceId}/qr-codes/import:
    post:
      tags: [Workspaces]
      summary: Import link QR codes into a workspace from CSV or JSON
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportQrCodesRequest"
      responses:
        "201":
          description: QR codes imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResponse"

  /public/r/{slug}:
    get:
      tags: [Public]
      summary: Resolve QR short URL
      parameters:
        - $ref: "#/components/parameters/SlugPath"
      responses:
        "302":
          description: Redirected
        "200":
          description: Password form or landing page
        "429":
          description: Rate limited
        "404":
          description: Not found
        "410":
          description: QR is inactive or expired

  /public/r/{slug}/password:
    post:
      tags: [Public]
      summary: Submit QR password and continue scan flow
      parameters:
        - $ref: "#/components/parameters/SlugPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "302":
          description: Redirected
        "200":
          description: Landing page or password prompt
        "401":
          description: Invalid password
        "429":
          description: Rate limited

  /public/inactive:
    get:
      tags: [Public]
      summary: Inactive QR page
      responses:
        "410":
          description: Viewer-facing inactive page

  /public/landing/{slug}:
    get:
      tags: [Public]
      summary: Render a landing representation for non-redirect QR content
      parameters:
        - $ref: "#/components/parameters/SlugPath"
      responses:
        "200":
          description: Landing page
        "429":
          description: Rate limited
        "410":
          description: QR is inactive

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    SlugPath:
      in: path
      name: slug
      required: true
      schema:
        type: string
    WorkspaceIdPath:
      in: path
      name: workspaceId
      required: true
      schema:
        type: string
        format: uuid
    DomainIdPath:
      in: path
      name: domainId
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    QRCodeStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED, DELETED]

    PlanCode:
      type: string
      enum: [enterprise, free, lite, premium]

    WorkspaceRole:
      type: string
      enum: [OWNER, ADMIN, EDITOR, VIEWER]

    ExportFormat:
      type: string
      enum: [png, svg]

    BulkTransferFormat:
      type: string
      enum: [json, csv]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
          format: uri
        defaultWorkspaceId:
          type: [string, "null"]
          format: uuid
        locale:
          type: string
      required: [id, email, fullName, avatarUrl, defaultWorkspaceId, locale]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: [string, "null"]
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ForgotPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
        expiresAt:
          type: [string, "null"]
          format: date-time
        resetToken:
          type: [string, "null"]
          description: Present in non-production environments to support local testing.
      required: [success]

    ResetPasswordRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 8
        token:
          type: string
      required: [password, token]

    ProfileUpdateRequest:
      type: object
      properties:
        fullName:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
          format: uri
        locale:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        accessToken:
          type: string
      required: [user, accessToken]

    WorkspaceSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          $ref: "#/components/schemas/PlanCode"
        slug:
          type: string
      required: [id, name, plan, slug]

    Workspace:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        customDomain:
          type: [string, "null"]
        customDomainCount:
          type: integer
        folderCount:
          type: integer
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          $ref: "#/components/schemas/PlanCode"
        qrCodeCount:
          type: integer
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        slug:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - createdAt
        - customDomain
        - customDomainCount
        - folderCount
        - id
        - name
        - plan
        - qrCodeCount
        - role
        - slug
        - updatedAt

    WorkspaceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
      required: [items]

    CreateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
      required: [name]
      example:
        name: "Campaign Ops"

    FolderSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: [string, "null"]
          format: uuid
      required: [id, name, parentId]

    Folder:
      allOf:
        - $ref: "#/components/schemas/FolderSummary"
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            qrCodeCount:
              type: integer
            updatedAt:
              type: string
              format: date-time
            workspaceId:
              type: string
              format: uuid
          required: [createdAt, qrCodeCount, updatedAt, workspaceId]

    FolderListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
      required: [items]

    CreateFolderRequest:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: [string, "null"]
          format: uuid
      required: [name]
      example:
        name: "Spring launch"
        parentId: null

    CustomDomain:
      type: object
      properties:
        certificateStatus:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        domain:
          type: string
        id:
          type: string
          format: uuid
        shortBaseUrl:
          type: string
        status:
          type: string
          enum: [pending, verified]
        targetHost:
          type: string
        txtRecordHost:
          type: string
        txtRecordValue:
          type: string
        updatedAt:
          type: string
          format: date-time
        verificationToken:
          type: string
      required:
        - certificateStatus
        - createdAt
        - domain
        - id
        - shortBaseUrl
        - status
        - targetHost
        - txtRecordHost
        - txtRecordValue
        - updatedAt
        - verificationToken

    CustomDomainListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomDomain"
      required: [items]

    CreateCustomDomainRequest:
      type: object
      properties:
        domain:
          type: string
      required: [domain]
      example:
        domain: "go.example.com"

    VerifyCustomDomainRequest:
      type: object
      properties:
        verificationToken:
          type: string
      required: [verificationToken]
      example:
        verificationToken: "verify_1234567890abcdef"

    ImportQrCodesRequest:
      type: object
      properties:
        format:
          $ref: "#/components/schemas/BulkTransferFormat"
        data:
          type: string
        folderId:
          type: [string, "null"]
          format: uuid
      required: [format, data]
      example:
        format: "csv"
        data: "title,link\nSpring launch,https://example.com/spring"
        folderId: null

    BulkImportResponse:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/CreateQRCodeResponse"
        createdCount:
          type: integer
        workspaceId:
          type: string
          format: uuid
      required: [created, createdCount, workspaceId]

    PasswordRequest:
      type: object
      properties:
        password:
          type: string
      required: [password]

    QRCodeDesign:
      type: object
      properties:
        sizePx:
          type: integer
        pattern:
          type: string
        patternColor:
          type: string
        backgroundColor:
          type: string
        cornersInner:
          type: string
        cornersInnerColor:
          type: string
        cornersOuter:
          type: string
        cornersOuterColor:
          type: string
        logoAssetId:
          type: [string, "null"]
          format: uuid
        logoHideBg:
          type: boolean
        errorCorrection:
          type: string
          enum: [L, M, Q, H]
        quietZoneModules:
          type: integer

    QRCodeSettings:
      type: object
      properties:
        adsEnabled:
          type: boolean
        doNotIndex:
          type: boolean
        password:
          type: [string, "null"]
        isOneTime:
          type: boolean
        maxScans:
          type: [integer, "null"]
        expiresAt:
          type: [string, "null"]
          format: date-time

    DownloadItem:
      type: object
      properties:
        bytes:
          type: [string, "null"]
        checksum:
          type: [string, "null"]
        format:
          type: string
        url:
          type: string
      required: [format, url]

    CreateQRCodeRequest:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        folderId:
          type: [string, "null"]
          format: uuid
        title:
          type: [string, "null"]
        type:
          type: string
          enum: [link]
        content:
          type: object
          properties:
            link:
              type: string
              format: uri
          required: [link]
        design:
          $ref: "#/components/schemas/QRCodeDesign"
        settings:
          $ref: "#/components/schemas/QRCodeSettings"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/ExportFormat"
      required: [workspaceId, type, content]
      example:
        workspaceId: "2f54368a-3d72-4aa1-bbe9-a9542e3ece3d"
        title: "Launch QR"
        type: "link"
        content:
          link: "https://example.com/launch"
        design:
          backgroundColor: "#ffffff"
          patternColor: "#111111"
          errorCorrection: "M"
          sizePx: 512
          quietZoneModules: 4
        settings:
          adsEnabled: true
          doNotIndex: false
          isOneTime: false
        exports: [png, svg]

    UpdateQRCodeRequest:
      type: object
      properties:
        title:
